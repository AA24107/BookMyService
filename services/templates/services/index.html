{% extends "services/layout.html" %}

{% block content %} 
    <hr>
    <div class="search">
        <input name="search" id="search-bar" placeholder="Search">
    </div>
    <hr>
    {% if services %}
    <div class="container-fluid" id="service-container">
        <!--Service Cards-->
            {% for service in services %}
                <div class= "card service-card mb-3" data-id="{{service.id}}">
                    <div>
                        <h5 class="card-title">{{service.name}}</h5>
                        <hr>
                        <p class="card-text">{{service.description}}</p>
                        <p class="card-text">@{{service.provider.user.username}}</p>
                        <p class="card-text"><strong>${{service.price}} </strong></p>
                    </div>
                </div>
            {% endfor %}
    </div>
    {% else %}
        <div>
            <h3>No Services Found</h3>
        </div>
    {% endif %}
{% endblock %}
