{% extends "services/layout.html" %}

{% block title %}Create a Service{% endblock %}

{% block content %} 
<br>
<div class="card">
    <div class="container-fluid ">
        {% if service %}
            <h1>Edit Service</h1>
            <form class="card-body" action="{% url 'edit_service' service.id %}" method="post">
        {% else %}
            <h1>Create a Service</h1>
            <form class="card-body" action="{% url 'create_service' %}" method="post">
        {% endif %}
            {% csrf_token %}
            <div class="form-group">
                <input  class="form-control" autofocus type="text" name="name" value="{{service.name}}" placeholder="Service">
            </div>
            <div class="form-group">
                <input  class="form-control" type="text" name="description" value="{{service.description}}" placeholder="Description">
            </div>
            <div class="form-group">
                <input  class="form-control" type="number" name="price" value="{{service.price}}" placeholder="Price">
            </div>
            {% if service %}
                <div class="form-group">
                    <input  class="btn btn-primary" type="submit" value="Update">
                </div>
            {% else %}
                <div class="form-group">
                    <input  class="btn btn-primary" type="submit" value="Save">
                </div>
            {% endif %}
        </form>
    </div>
</div>

{% endblock %}
