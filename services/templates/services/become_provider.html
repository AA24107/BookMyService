{% extends "services/layout.html" %}

{% block title %}Login{% endblock %}

{% block content %} 
<br>
<div class="card">
    <div class="container-fluid ">
        <h1>Login</h1>
        <form class="card-body" action="{% url 'become_provider' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <input  class="form-control" autofocus type="text" name="description" placeholder="Description">
            </div>
            <div class="form-group">
                <input  class="btn btn-primary" type="submit" value="Login">
            </div>
        </form>
    </div>
</div>






{% endblock %}
